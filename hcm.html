function modeTip(r,step){const a=spec(r),n=orderOf(r).map(i=>symbols(r)[i]).join(' → ');if(lang==='ru')return RU_TIPS[r.type][Math.min(step,2)].replace('{order}',n);const H={shapes:[["칠판에서 ▲, ●, ★를 찾아봐. 하지만 지워진 그림도 있어.","Find ▲, ● and ★ on the board. Some are crossed out."],["규칙 포스터를 읽으면 어느 그림을 빼야 하는지 알 수 있어.","Read the rule poster to learn what to ignore."],[`순서표는 ${n}. X로 지워진 도형을 제외하고 각 개수를 세어 봐.`,`The order is ${n}. Ignore crossed-out shapes and count the others.`]],lights:[["전구판에는 켜진 전구와 꺼진 전구가 함께 있어.","Some bulbs are on, others are broken."],["수리 안내문을 보고 어떤 전구를 세야 하는지 확인해.","Check the repair guide to decide which bulbs count."],[`색 순서는 ${n}. 빛나는 전구만 색깔별로 세어 봐.`,`Color order: ${n}. Count only glowing bulbs.`]],cipher:[["암호책에 기호 3개의 숫자가 적혀 있지만 하나가 없어.","The cipher book lists symbols, but one value is missing."],["찢어진 암호 조각에서 빈 숫자를 계산할 수 있어.","The missing fragment contains an equation."],[`기호 순서는 ${n}. 암호책과 조각의 값을 연결해.`,`Use the order ${n} and match values from the book and fragment.`]],grid:[["보물 지도에는 A~C열, 1~3행에 숫자가 숨겨져 있어.","The map has numbers at columns A–C and rows 1–3."],["좌표 메모에서 찾아야 할 위치 세 개를 알아내.","The coordinate memo tells you three positions."],[`메모 위치를 순서대로 읽고, 지도에서 각 칸의 숫자를 가져와.`,`Read each map cell in the order shown on the memo.`]],clock:[["시계 바늘은 각각 숫자 하나를 가리켜.","Each clock hand points to one digit."],["일반적인 시계와 달리 0~9만 적혀 있어.","These dials show 0–9, not a regular 12-hour clock."],[`순서표는 ${n}. 그 순서대로 바늘 끝의 숫자를 읽어.`,`Clock order: ${n}. Read the digit each hand points to.`]],sequence:[["숫자 화면의 각 줄에서 ? 자리에 들어갈 숫자를 찾아.","Predict the missing ? in each row."],["숫자 규칙책을 보고 변화의 크기와 9 다음 숫자를 확인해.","The pattern guide explains the step and wraparound."],[`순서표는 ${n}. 각 줄은 1씩 증가하고 9 다음은 0이야.`,`Order: ${n}. Each row goes up by 1, wrapping 9 to 0.`]]};return H[r.type][Math.min(step,2)][lang==='ko'?0:1]}
function toPlace(name){if(lang!=='ko')return name;const ch=name.charCodeAt(name.length-1),jong=ch>=0xAC00&&ch<=0xD7A3?(ch-0xAC00)%28:0;return name+(jong&&jong!==8?'으로':'로')}
function answerChat(q){const r=rooms[game.room],unseen=game.seen.findIndex(v=>!v),target=unseen<0?null:station(r,unseen).name;if(q==='recap')return game.seen.map((v,i)=>`${v?'✅':'❔'} ${station(r,i).name}`).join('\n')+'\n'+T('orderGuide');if(q==='where'){if(target===null)return T('hintReview');return unseen===0?T('hintLocation').replace('{where}',toPlace(target)):T('hintNext').replace('{where}',toPlace(target))}if(q==='pass'){if(r.level===2&&game.hintLevel===0)return L('비밀번호는 단서 3곳에 나누어져 있어. 먼저 방을 둘러봐.','The code is split across three clue spots. Explore first.','Код разделён на три подсказки. Сначала осмотри комнату.');if(!game.seen[0])return T('hintLocation').replace('{where}',toPlace(station(r,0).name));if(!game.seen[1])return T('hintNext').replace('{where}',toPlace(station(r,1).name));if(!game.seen[2])return T('hintNext').replace('{where}',toPlace(station(r,2).name));return T('hintReview')}if(q==='rule'){return game.seen[2]?modeTip(r,1):T('hintLocation').replace('{where}',toPlace(station(r,2).name))}let step=Math.min(game.hintLevel,2);if(r.level===0)step=Math.min(step+1,2);if(r.level===2)step=Math.max(0,step-1);return modeTip(r,step)}

function cipherBoard(r){return `<div class="cipherboard"><div class="clue-header">${L('암호 사전 · 마지막 기호의 숫자가 지워짐','Cipher Book · one number has been erased','Книга шифров · одна цифра стёрта')}</div>${[0,1,2].map(i=>`<div class="cipherline"><span>${symbols(r)[i]}</span><b>=</b><strong>${i===2?'❓':valueAt(r,i)}</strong></div>`).join('')}</div>`}
const GRID_COORDS=['B1','C2','A3'];const GRID_IDX=[1,5,6];
function gridCells(r){let a=[...Array(9)].map((_,i)=>(i*7+Number(r.code[(i+1)%3])+4)%10);for(let i=0;i<3;i++)a[GRID_IDX[i]]=valueAt(r,i);return a}
function gridBoard(r){const arr=gridCells(r);return `<div class="clue-header">${L('A~C는 가로 열 / 1~3은 세로 행','A–C = columns / 1–3 = rows','A–C — столбцы / 1–3 — строки')}</div><div class="coord-board"><div class="coord-cell index">↘</div>${['A','B','C'].map(x=>`<div class="coord-cell head">${x}</div>`).join('')}${arr.map((n,i)=>`${i%3===0?`<div class="coord-cell index">${Math.floor(i/3)+1}</div>`:''}<div class="coord-cell">${n}</div>`).join('')}</div>`}
function dialSvg(value,color){const cx=76,cy=76,rad=52;const labels=Array.from({length:10},(_,i)=>{const theta=(i*36-90)*Math.PI/180;return `<text x="${(cx+rad*Math.cos(theta)).toFixed(1)}" y="${(cy+rad*Math.sin(theta)+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="900" fill="#53637c">${i}</text>`}).join('');const a=(value*36-90)*Math.PI/180;return `<svg class="clock-svg" viewBox="0 0 152 152" role="img" aria-label="dial"><circle cx="76" cy="76" r="71" fill="#f7f9ff" stroke="${color}" stroke-width="4"/><circle cx="76" cy="76" r="61" fill="#fff" stroke="#d8deec" stroke-width="1.6"/>${labels}<line x1="76" y1="76" x2="${(cx+40*Math.cos(a)).toFixed(1)}" y2="${(cy+40*Math.sin(a)).toFixed(1)}" stroke="${color}" stroke-width="5" stroke-linecap="round"/><circle cx="76" cy="76" r="7" fill="${color}"/></svg>`}
function clockBoard(r){const colors=['#e85b68','#429bde','#e8b04d'];return `<div class="clue-header">${L('어느 숫자를 가리키나요?','What digit does each hand point to?','На какую цифру указывает стрелка?')}</div><div class="clock-list">${[0,1,2].map(i=>`<div class="dial-wrap"><div class="dial-label">${symbols(r)[i]}</div>${dialSvg(valueAt(r,i),colors[i])}</div>`).join('')}</div>`}
function seqBoard(r){return `<div class="clue-header">${L('한 줄씩 규칙을 찾아보세요','Find the rule for each sequence','Найди правило каждого ряда')}</div><div class="sequence-list">${[0,1,2].map(i=>{let n=valueAt(r,i);return `<div class="sequence-row"><span class="sequence-tag">${symbols(r)[i]}</span>${[3,2,1].map(offset=>`<span class="seq-number">${(n-offset+10)%10}</span><span style="color:#a4afc2">›</span>`).join('')}<span class="seq-number seq-question">?</span></div>`}).join('')}</div>`}
function orderNote(r){const vals=orderOf(r).map(i=>r.type==='grid'?GRID_COORDS[i]:symbols(r)[i]);return `<div class="paper-note"><h3>📋 ${L('비밀번호를 읽는 순서','Read the code in this order','Порядок цифр кода')}</h3><div class="ordered-icons">${vals.map((x,i)=>`${i>0?'<span class="arrow">→</span>':''}<span class="item">${x}</span>`).join('')}</div><p>${L('1번째 → 2번째 → 3번째','1st → 2nd → 3rd','1-я → 2-я → 3-я')}</p></div>`}
function ruleNote(r){let content={shapes:["X 표시로 지워진 도형은 세지 마세요!","Ignore all crossed-out symbols!","❌ → 0","Не считай зачёркнутые фигуры!"],lights:["꺼진 전구는 제외! 빛나는 전구만 세기","Ignore broken bulbs. Count glowing lights only.","💡 ✨","Не считай выключенные лампы. Только горящие!"],cipher:[`${valueAt(r,2)+2} − 2 = ? 　→　${symbols(r)[2]}`,`${valueAt(r,2)+2} − 2 = ? 　→　${symbols(r)[2]}`,"🧩",`${valueAt(r,2)+2} − 2 = ? 　→　${symbols(r)[2]}`],grid:["A~C = 왼쪽에서 오른쪽으로 / 1~3 = 위에서 아래로","A–C = left to right / 1–3 = top to bottom","↘","A–C слева направо / 1–3 сверху вниз"],clock:["일반 시계 아님! 0~9에서 바늘 끝 숫자 확인","Not a regular clock! Read 0–9 at the hand tip.","🕰️","Это не обычные часы: цифры от 0 до 9."],sequence:["1씩 증가! 9 다음에는 0으로 돌아가기","Add 1 each time. After 9, wrap back to 0.","9 → 0 → 1","Прибавляй 1. После 9 идёт 0."]}[r.type];return `<div class="rule-note"><span class="rule-icon">${content[2]}</span><strong>${content[lang==='ko'?0:lang==='ru'?3:1]}</strong><p>${L('다른 장소에서 찾은 그림·순서와 합쳐보세요.','Combine this with the picture and the order memo.','Соедини это с рисунком и запиской о порядке.')}</p></div>`}
function clueVisual(r,i){if(i===1)return orderNote(r);if(i===2)return ruleNote(r);return {shapes:digitsBoard,lights:lightBoard,cipher:cipherBoard,grid:gridBoard,clock:clockBoard,sequence:seqBoard}[r.type](r)}
function renderModal(){const el=document.getElementById('modal');if(!modalState){el.classList.add('hide');return}el.classList.remove('hide');const r=rooms[game.room];if(modalState.type==='clue'){const idx=modalState.idx,st=station(r,idx),title=[T('introMain'),T('introOrder'),T('introRule')][idx];el.innerHTML=`<div class="modal-box clue-modal"><div class="modal-head"><div class="big-icon">${st.icon}</div><div><h2>${st.name}</h2><p>${title} · ${spec(r).name[langIdx()]}</p></div><button class="modal-close" data-action="close" aria-label="Close">×</button></div><div class="investigation">${clueVisual(r,idx)}</div><div class="investigation-note">📒 ${L('장소를 조사했어요. 중요한 정보를 기억하거나 친구와 이야기해보세요.','Clue inspected! Remember what you saw or discuss with a friend.','Ты изучил подсказку! Запомни её или обсуди с другом.')}</div><div class="modal-foot"><button class="btn primary" data-action="close">${T('saveNote')}</button><button class="btn" data-action="hint-modal">💬 ${T('askMore')}</button></div></div>`;return}
 el.innerHTML=`<div class="modal-box"><div class="modal-head"><div class="big-icon">🚪</div><div><h2>${T('doorTitle')}</h2><p>${T('doorSub')}</p></div><button class="modal-close" data-action="close">×</button></div><div class="code-entry">${[0,1,2].map(i=>`<div class="code-slot">${game.entry[i]??'·'}</div>`).join('')}</div><div class="door-pad">${[1,2,3,4,5,6,7,8,9,'clear',0,'back'].map(n=>`<button data-action="${typeof n==='string'?'code-'+n:'code'}" ${typeof n==='number'?`data-idx="${n}"`:''} class="${typeof n==='string'?'special':''}">${n==='clear'?T('clear'):n==='back'?'⌫':n}</button>`).join('')}</div><div class="puzzle-error">${escapeHTML(modalState.error||'')}</div><div class="modal-foot"><button class="btn primary" data-action="unlock">${T('enter')}</button><button class="btn quiet" data-action="close">${T('close')}</button></div></div>`}
function unlock(){if(!modalState||modalState.type!=='door')return;if(game.entry.length!==3){modalState.error=T('codeMissing');renderModal();return}if(game.entry===rooms[game.room].code){hideModal();nextRoom(game.room+1)}else{modalState.error=T('codeWrong');game.entry='';renderModal()}}
function hintFromModal(){hideModal();game.tab='chat';renderPlayer();showToast(T('needBot'))}
function showToast(str){const el=document.getElementById('toast');el.textContent=str;el.classList.remove('hide');clearTimeout(notificationTimer);notificationTimer=setTimeout(()=>el.classList.add('hide'),2100)}
function download(name,data,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function saveProject(){download('escape_lab_detective_design.json',JSON.stringify({version:3,rooms},null,2),'application/json;charset=utf-8')}
function exportPlay(){
 // Freeze the three student-designed rooms into a self-contained play-only HTML file.
 // The editor page is physically removed; players cannot see or enter edit mode.
 const safe=JSON.stringify(rooms).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
 const root=document.documentElement.cloneNode(true);
 root.querySelector('#builder')?.remove();
 root.querySelector('#fileInput')?.remove();
 const player=root.querySelector('#player');if(player){player.innerHTML='';player.classList.add('hide')}
 const gate=root.querySelector('#languageGate');gate?.classList.remove('hide');
 const modal=root.querySelector('#modal');if(modal){modal.innerHTML='';modal.classList.add('hide')}
 const toast=root.querySelector('#toast');if(toast){toast.textContent='';toast.classList.add('hide')}
 const title=root.querySelector('title');if(title)title.textContent='ESCAPE LAB — 3 ROOM GAME';
 const config='<scr'+'ipt>window.__EXPORTED_ROOMS__='+safe+'</scr'+'ipt>';
 const html='<!DOCTYPE html>\n'+root.outerHTML.replace('</head>',config+'\n</head>');
 download('escape_lab_game_only.html',html,'text/html;charset=utf-8');showToast(T('downloaded'))
}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function act(a,el){if(a==='pick-language'){document.getElementById('languageGate').classList.add('hide');setLang(el.dataset.lang);if(exported&&!playing)start();return}if(a==='lang'){setLang(el.dataset.lang);return}if(a==='room'){currentRoom=+el.dataset.idx;selectedDigit=0;renderBuilder();return}if(a==='theme'){rooms[currentRoom].scene=el.dataset.key;persist();renderBuilder();return}if(a==='layout'){rooms[currentRoom].layout=+el.dataset.idx;persist();renderBuilder();return}if(a==='puzzle'){rooms[currentRoom].type=el.dataset.key;persist();renderBuilder();return}if(a==='order'){rooms[currentRoom].order=+el.dataset.idx;persist();renderBuilder();return}if(a==='level'){rooms[currentRoom].level=+el.dataset.idx;persist();renderBuilder();return}if(a==='select-digit'){selectedDigit=+el.dataset.idx;renderBuilder();return}if(a==='digit'){const c=rooms[currentRoom].code.split('');c[selectedDigit]=el.dataset.idx;rooms[currentRoom].code=c.join('');selectedDigit=(selectedDigit+1)%3;persist();renderBuilder();return}if(a==='bot'){rooms[currentRoom].bot=+el.dataset.idx;persist();renderBuilder();return}if(a==='next-room'){currentRoom=(currentRoom+1)%3;selectedDigit=0;renderBuilder();return}if(a==='start'){start();return}if(a==='save'){saveProject();return}if(a==='load'){document.getElementById('fileInput').click();return}if(a==='export'){exportPlay();return}if(a==='exit'){exitGame();return}if(a==='restart'){restart();return}if(a==='interact'){interact();return}if(a==='tab'){game.tab=el.dataset.tab;renderSidebar();return}if(a==='ask'){ask(el.dataset.question);return}if(a==='close'){hideModal();return}if(a==='hint-modal'){hintFromModal();return}if(a==='code'){if(game.entry.length<3)game.entry+=el.dataset.idx;renderModal();return}if(a==='code-clear'){game.entry='';renderModal();return}if(a==='code-back'){game.entry=game.entry.slice(0,-1);renderModal();return}if(a==='unlock'){unlock();return}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)act(el.dataset.action,el)});
document.getElementById('fileInput')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const json=JSON.parse(await file.text()),arr=normalRooms(json.rooms||json);if(!arr)throw Error('invalid');rooms=arr;currentRoom=0;selectedDigit=0;persist();renderBuilder();showToast(T('loaded'))}catch{showToast(T('badFile'))}e.target.value=''});
const controlMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
document.addEventListener('keydown',e=>{if(!playing||game?.complete)return;if(e.key==='Escape'&&modalState){e.preventDefault();hideModal();return}if(modalState){if(modalState.type==='door'){if(/^\d$/.test(e.key)){e.preventDefault();if(game.entry.length<3)game.entry+=e.key;renderModal()}else if(e.key==='Backspace'){e.preventDefault();game.entry=game.entry.slice(0,-1);renderModal()}else if(e.key==='Enter'){e.preventDefault();unlock()}}return}const dir=controlMap[e.key];if(dir){if(!['INPUT','TEXTAREA'].includes(e.target?.tagName)){e.preventDefault();keys[dir]=true}return}if(e.key==='e'||e.key==='E'||e.code==='Space'){if(!['INPUT','TEXTAREA'].includes(e.target?.tagName)&&(e.code!=='Space'||e.target?.tagName!=='BUTTON')){e.preventDefault();interact()}}});
document.addEventListener('keyup',e=>{const dir=controlMap[e.key];if(dir)keys[dir]=false});window.addEventListener('blur',()=>keys={});
document.addEventListener('pointerdown',e=>{const p=e.target.closest('[data-control]');if(p){e.preventDefault();keys[p.dataset.control]=true;p.setPointerCapture?.(e.pointerId)}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])document.addEventListener(ev,e=>{const p=e.target.closest?.('[data-control]');if(p)keys[p.dataset.control]=false});
document.addEventListener('click',e=>{if(!playing||modalState||game?.complete||e.target.id!=='gameCanvas')return;const box=e.target.getBoundingClientRect(),x=(e.clientX-box.left)/box.width*WIDTH,y=(e.clientY-box.top)/box.height*HEIGHT,near=getNearby();if(near){const p=positionOf(near,rooms[game.room]);if(p&&Math.hypot(x-p[0]-.5,y-p[1]-.5)<.85)interact()}else showToast(T('notNear'))});
if(exported){document.getElementById('builder')?.classList.add('hide')}else{renderBuilder()}document.getElementById('languageGate').classList.remove('hide')
})();
</script>


</body></html>
